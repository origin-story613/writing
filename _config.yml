title: Yosef Main
description: Digital marketing strategist writing on martech, SEO, and the seam between marketing and engineering.
theme: minima

# Minima theme settings
minima:
  skin: classic
  social_links:
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/mainyosef" }
    - { platform: github,   user_url: "https://github.com/origin-story613" }

# Site URL settings — custom domain, no baseurl needed (site lives at the root)
url: "https://yosefmain.com"
baseurl: ""
 
# Google Analytics — replace with your actual GA4 Measurement ID (starts with G-)
# The minima theme automatically injects the tag from _includes/google-analytics.html
# into every page's <head> when this is set and the build runs in production
# (GitHub Pages always builds in production, so no extra step needed there).
google_analytics: G-4Y2CYEN6FQ

# Show full article list, not just excerpts, on the home page (optional — see README)
show_excerpts: true

# URL structure for posts — slug only, no date.
# Post FILENAMES still need a YYYY-MM-DD prefix (Jekyll uses that internally
# for sorting/chronology), but this setting strips the date from the
# published URL, so /writing/2026-04-29-my-post/ becomes /writing/my-post/
permalink: /:title/

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Nav pages (shown in the header)
header_pages:
  - about.md
  - press.md
